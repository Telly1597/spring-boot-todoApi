<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My To-Do List</title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
        form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 12px; margin-bottom: 20px; }
        .full { grid-column: 1 / -1; }
        label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #444; }
        input, textarea { padding: 8px; font-size: 15px; font-family: inherit; }
        textarea { resize: vertical; min-height: 48px; }
        button { padding: 8px 12px; cursor: pointer; }
        .field-error { color: #b42318; font-size: 12px; min-height: 14px; }
        #formError { color: #b42318; margin: 0; }
        li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .when { font-size: 12px; color: #666; }
        .desc { font-size: 13px; color: #555; }
        .done .title { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
<h1>My To-Do List</h1>

<form id="taskForm" novalidate>
    <label class="full">Title
        <input type="text" id="title" placeholder="What do you need to do?" required>
        <span class="field-error" data-for="title"></span>
    </label>

    <label>Date
        <input type="date" id="date" required>
    </label>
    <label>Start
        <input type="time" id="start" step="900" required>
        <span class="field-error" data-for="startTime"></span>
    </label>
    <label>End
        <input type="time" id="end" step="900" required>
        <span class="field-error" data-for="endTime"></span>
    </label>

    <label class="full">Description (optional)
        <textarea id="description" maxlength="500"></textarea>
        <span class="field-error" data-for="description"></span>
    </label>

    <p id="formError" class="full" role="alert"></p>
    <button type="submit" class="full">Add task</button>
</form>

<ul id="taskList"></ul>

<script>
    const list = document.getElementById("taskList");
    const form = document.getElementById("taskForm");
    const formError = document.getElementById("formError");

    // ---------- helpers ----------

    const pad = n => String(n).padStart(2, "0");
    const toDateValue = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const toTimeValue = mins => `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;

    // Today, next quarter hour, one hour long (never past 23:45)
    function setDefaults() {
        const now = new Date();
        let start = Math.ceil((now.getHours() * 60 + now.getMinutes() + 1) / 15) * 15;
        start = Math.min(start, 23 * 60 + 30);
        const end = Math.min(start + 60, 23 * 60 + 45);

        document.getElementById("date").value = toDateValue(now);
        document.getElementById("start").value = toTimeValue(start);
        document.getElementById("end").value = toTimeValue(end);
    }

    function clearErrors() {
        formError.textContent = "";
        document.querySelectorAll(".field-error").forEach(el => el.textContent = "");
    }

    // Show the backend's ErrorResponse: field messages under inputs, the rest above the button
    async function showError(response) {
        let body;
        try { body = await response.json(); } catch { body = null; }

        const fieldErrors = body?.fieldErrors ?? {};
        let shownUnderField = false;
        for (const [field, message] of Object.entries(fieldErrors)) {
            const slot = document.querySelector(`.field-error[data-for="${field}"]`);
            if (slot) { slot.textContent = message; shownUnderField = true; }
        }
        if (!shownUnderField) {
            formError.textContent = body?.message ?? `Request failed (${response.status})`;
        }
    }

    function formatWhen(task) {
        const day = new Date(task.startTime).toLocaleDateString(undefined,
            { weekday: "short", month: "short", day: "numeric" });
        return `${day} · ${task.startTime.slice(11, 16)}–${task.endTime.slice(11, 16)}`;
    }

    // ---------- load ----------

    async function loadTasks() {
        const response = await fetch("/tasks");
        if (!response.ok) { formError.textContent = "Couldn't load tasks."; return; }

        const tasks = await response.json();
        tasks.sort((a, b) => (a.startTime ?? "").localeCompare(b.startTime ?? ""));
        list.innerHTML = "";

        tasks.forEach(task => {
            const li = document.createElement("li");
            if (task.done) li.classList.add("done");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.done;
            checkbox.onchange = () => toggleTask(task);

            const info = document.createElement("div");
            info.className = "info";

            const title = document.createElement("span");
            title.className = "title";
            title.textContent = task.title;
            info.append(title);

            if (task.startTime && task.endTime) {
                const when = document.createElement("span");
                when.className = "when";
                when.textContent = formatWhen(task);
                info.append(when);
            }

            if (task.description) {
                const desc = document.createElement("span");
                desc.className = "desc";
                desc.textContent = task.description;
                info.append(desc);
            }

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.onclick = () => deleteTask(task.id);

            li.append(checkbox, info, deleteBtn);
            list.appendChild(li);
        });
    }

    // ---------- add ----------

    form.onsubmit = async (event) => {
        event.preventDefault();
        clearErrors();

        const date = document.getElementById("date").value;
        const payload = {
            title: document.getElementById("title").value,
            description: document.getElementById("description").value || null,
            startTime: `${date}T${document.getElementById("start").value}`,
            endTime: `${date}T${document.getElementById("end").value}`,
            done: false
        };

        const response = await fetch("/tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!response.ok) { await showError(response); return; }

        form.reset();
        setDefaults();
        await loadTasks();
    };

    // ---------- toggle (sends the full task, since PUT validates everything) ----------

    async function toggleTask(task) {
        clearErrors();
        const response = await fetch("/tasks/" + task.id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                title: task.title,
                description: task.description,
                startTime: task.startTime,
                endTime: task.endTime,
                done: !task.done
            })
        });
        if (!response.ok) await showError(response);
        await loadTasks();
    }

    // ---------- delete ----------

    async function deleteTask(id) {
        clearErrors();
        const response = await fetch("/tasks/" + id, { method: "DELETE" });
        if (!response.ok) await showError(response);
        await loadTasks();
    }

    setDefaults();
    loadTasks();
</script>
</body>
</html>
